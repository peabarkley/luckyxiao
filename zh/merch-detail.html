<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>跳转中... | LuckyXiao肖确幸</title>
  
  <!-- 关键：告诉搜索引擎不要收录这个动态壳子页 -->
  <meta name="robots" content="noindex, follow">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #1f2937; background-color: #ffffff; display: flex; flex-direction: column; min-height: 100vh; }
    a { text-decoration: none; color: inherit; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; width: 100%; }
    
    .navbar { background: #ffffff; box-shadow: 0 2px 15px rgba(229, 62, 62, 0.1); padding: 16px 0; position: sticky; top: 0; z-index: 100; }
    .navbar .container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 1.5rem; font-weight: 700; }
    .logo-img { height: 40px; width: auto; }
    .logo-highlight { color: #e53e3e; }
    .nav-right { display: flex; align-items: center; gap: 2rem; }
    .nav-links { display: flex; gap: 2.5rem; font-weight: 500; }
    .nav-links a:hover { color: #e53e3e; }

    .detail-page { flex: 1; padding: 100px 0; text-align: center; }
    .detail-content { max-width: 600px; margin: 0 auto; background: #fef2f2; border-radius: 40px; padding: 3rem; }
    .detail-content p { color: #4b5563; margin-bottom: 1rem; font-size: 1.1rem; }
    .spinner { font-size: 2rem; color: #e53e3e; margin-bottom: 1rem; animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    .btn { display: inline-block; padding: 12px 32px; border-radius: 40px; font-weight: 600; transition: all 0.3s; cursor: pointer; border: 2px solid #e53e3e; font-size: 1rem; background: transparent; color: #e53e3e; margin-top: 1.5rem; }
    .btn:hover { background: #e53e3e; color: white; transform: translateY(-3px); }
    
    .footer { background: #111827; color: #d1d5db; padding: 40px 0; text-align: center; margin-top: auto; }
    .footer-credit { font-size: 0.9rem; color: #9ca3af; letter-spacing: 1px; }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <img src="../images/logo.png" alt="LuckyXiao" class="logo-img" onerror="this.style.display='none'">
        <span class="logo-text">✦ LuckyXiao<span class="logo-highlight">肖确幸</span></span>
      </a>
      <div class="nav-right">
        <nav class="nav-links">
          <a href="index.html">首页</a>
          <a href="zodiacs.html">十二天团</a>
          <a href="merch.html">周边产品</a>
          <a href="about.html">理念</a>
          <a href="contact.html">联系</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="detail-page">
    <div class="container">
      <div class="detail-content" id="jump-container">
        <div class="spinner"><i class="fas fa-spinner"></i></div>
        <p>正在为您跳转到对应的产品页面...</p>
        <p style="font-size: 0.9rem; color: #9ca3af;">如果没有自动跳转，请点击下方按钮。</p>
        <a href="merch.html" class="btn" id="fallback-btn">返回周边列表</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2025 LuckyXiao肖确幸 · 原创IP。保留所有权利。</p>
      <p class="footer-credit">“BORN TO BE DIFFERENT 生而不同” — 重新发现世界与未来</p>
    </div>
  </footer>

  <script>
    // 页面加载后立即执行跳转逻辑
    (function redirectToStaticPage() {
      // 1. 获取 URL 中的 id 参数
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id');
      
      // 2. 如果存在有效的 id 参数，则重定向到对应的静态页
      if (productId && /^[a-z]+$/.test(productId)) { // 简单正则防注入
        // 例如: zh/merch/blindbox.html
        window.location.replace('merch/' + productId + '.html');
      } else {
        // 如果没有参数或参数格式不对，3秒后自动退回到周边列表页
        const fallbackBtn = document.getElementById('fallback-btn');
        setTimeout(function() {
          window.location.replace('merch.html');
        }, 3000);
      }
    })();
  </script>
</body>
</html>
